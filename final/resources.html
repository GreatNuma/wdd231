  <main>
    <h1>Resources</h1>
    <p>A short reading list to pair with your habits, plus a recommendation tool that pulls straight from the Activity Library.</p>

    <section id="resource-grid" class="resource-grid" aria-label="Curated resources"></section>

    <section class="panel recommendation-form">
      <h2>Get a Recommendation</h2>
      <form id="recommendation-form">
        <label for="goal">What are you focused on?
          <select id="goal" name="goal" required autocomplete="off">
            <option value="">Choose a focus area</option>
            <option value="wellness">Wellness</option>
            <option value="focus">Focus</option>
            <option value="fitness">Fitness</option>
            <option value="mindset">Mindset</option>
            <option value="learning">Learning</option>
          </select>
        </label>
        <input type="submit" value="Suggest Activities" class="button small">
      </form>
      <div id="recommendation" aria-live="polite"></div>
    </section>
  </main>
