<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized skyline illustration representing Lagos, Nigeria's business district" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b6e4f"/>
      <stop offset="100%" stop-color="#0f8863"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>

  <!-- sun/glow -->
  <circle cx="980" cy="120" r="90" fill="#d4a017" opacity="0.35"/>
  <circle cx="980" cy="120" r="55" fill="#d4a017" opacity="0.55"/>

  <!-- water reflection strip -->
  <rect x="0" y="400" width="1200" height="80" fill="#083f2e" opacity="0.6"/>

  <!-- skyline buildings -->
  <g fill="#083f2e">
    <rect x="40" y="260" width="70" height="160"/>
    <rect x="120" y="200" width="55" height="220"/>
    <rect x="185" y="290" width="60" height="130"/>
    <rect x="255" y="150" width="80" height="270"/>
    <rect x="345" y="230" width="50" height="190"/>
    <rect x="405" y="180" width="65" height="240"/>
    <rect x="480" y="260" width="55" height="160"/>
    <rect x="545" y="120" width="90" height="300"/>
    <rect x="645" y="220" width="60" height="200"/>
    <rect x="715" y="270" width="50" height="150"/>
    <rect x="775" y="160" width="75" height="260"/>
    <rect x="860" y="240" width="55" height="180"/>
  </g>

  <!-- window lights -->
  <g fill="#d4a017" opacity="0.85">
    <rect x="555" y="140" width="8" height="8"/>
    <rect x="575" y="140" width="8" height="8"/>
    <rect x="555" y="165" width="8" height="8"/>
    <rect x="575" y="165" width="8" height="8"/>
    <rect x="555" y="190" width="8" height="8"/>
    <rect x="575" y="190" width="8" height="8"/>
    <rect x="415" y="200" width="8" height="8"/>
    <rect x="435" y="200" width="8" height="8"/>
    <rect x="415" y="225" width="8" height="8"/>
    <rect x="435" y="225" width="8" height="8"/>
    <rect x="790" y="180" width="8" height="8"/>
    <rect x="810" y="180" width="8" height="8"/>
    <rect x="790" y="205" width="8" height="8"/>
    <rect x="810" y="205" width="8" height="8"/>
  </g>
</svg>
